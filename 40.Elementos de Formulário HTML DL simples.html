<!DOCTYPEHTML>
<Html lang="pt">
<head>
     <meta charset="UTF-8">
     <Title>Elementos de Formulário HTML</Title>
</head>
     <h2>Elementos de Formulário HTML</h2>
<body>
      <dl>
  <dt>&lt;input&gt;</dt>
  <dd>Campo versátil para entrada de dados (texto, palavra-passe, número, botões, etc.).</dd>

  <dt>&lt;select&gt;</dt>
  <dd>Cria uma lista suspensa de opções selecionáveis pelo utilizador.</dd>

  <dt>&lt;textarea&gt;</dt>
  <dd>Campo de caixa de texto multilinhas para mensagens longas.</dd>
</dl>

</body>
</html>
