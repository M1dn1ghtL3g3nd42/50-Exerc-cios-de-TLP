     <h2>Testes de Rede</h2>
<body>
     <dl>
  <dt>ping</dt>
  <dd>Testa a conetividade entre nós via pacotes ICMP. Sintaxe: <code>ping 192.168.1.1</code> ou <code>ping google.com</code></dd>

  <dt>traceroute / tracert</dt>
  <dd>Mapeia a rota que os pacotes percorrem até ao destino. Sintaxe: <code>traceroute google.com</code> (Linux) ou <code>tracert google.com</code> (Windows)</dd>
</dl>


</body>
</html>
