<!DOCTYPEHTML>
<Html lang="pt">
<head>
     <meta charset="UTF-8">
     <Title>Estruturas de Controlo</Title>
</head>
     <h2>Estruturas de Controlo</h2>
<body>
     <dl>
  <dt>if</dt>
  <dd>Estrutura condicional. Exemplo: <code>if (x &gt; 0) { console.log("Positivo"); }</code></dd>

  <dt>for</dt>
  <dd>Laço de repetição determinado. Exemplo: <code>for (let i = 0; i &lt; 5; i++) { }</code></dd>

  <dt>while</dt>
  <dd>Laço baseado em condição booleana. Exemplo: <code>while (ativo) { processar(); }</code></dd>
</dl>

</body>
</html>
