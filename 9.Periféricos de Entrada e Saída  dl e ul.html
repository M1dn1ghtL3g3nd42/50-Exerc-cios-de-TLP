<!DOCTYPEHTML>
<Html lang="pt">
<head>
     <meta charset="UTF-8">
     <Title>Periféricos de Entrada e Saída</Title>
</head>
     <h2>Periféricos de Entrada e Saída</h2>
<body>
     <dl>
  <dt>Periféricos de Entrada</dt>
  <dd>
    Enfiam dados do utilizador para o computador.
    <ul>
      <li>Teclado</li>
      <li>Rato (Mouse)</li>
      <li>Scanner</li>
    </ul>
  </dd>

  <dt>Periféricos de Saída</dt>
  <dd>
    Apresentam dados processados do computador ao utilizador.
    <ul>
      <li>Monitor</li>
      <li>Impressora</li>
      <li>Colunas de Som</li>
    </ul>
  </dd>
</dl>

</body>
</html>
