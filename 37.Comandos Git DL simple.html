<!DOCTYPEHTML>
<Html lang="pt">
<head>
     <meta charset="UTF-8">
     <Title>Comandos Git</Title>
</head>
     <h2>Comandos Git</h2>
<body>
     <dl>
  <dt>commit</dt>
  <dd>Guarda as alterações no repositório local. Exemplo: <code>git commit -m "Nova funcionalidade"</code></dd>

  <dt>push</dt>
  <dd>Envia os commits locais para o repositório remoto. Exemplo: <code>git push origin main</code></dd>

  <dt>pull</dt>
  <dd>Baixa e funde as atualizações do repositório remoto na branch local. Exemplo: <code>git pull origin main</code></dd>
</dl>

</body>
</html>
