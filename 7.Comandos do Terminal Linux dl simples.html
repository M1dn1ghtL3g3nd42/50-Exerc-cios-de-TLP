     <Title>Comandos do Terminal Linux</Title>

     <h2>Comandos do Terminal Linux</h2>
<body>
     <dl>
  <dt>ls</dt>
  <dd>Lista os ficheiros e diretórios do diretório atual.</dd>

  <dt>cd</dt>
  <dd>Navega e altera o diretório de trabalho atual.</dd>

  <dt>mkdir</dt>
  <dd>Cria um novo diretório na pasta especificada.</dd>

  <dt>rm</dt>
  <dd>Remove ficheiros ou diretórios do sistema.</dd>
</dl>


</body>
</html>
