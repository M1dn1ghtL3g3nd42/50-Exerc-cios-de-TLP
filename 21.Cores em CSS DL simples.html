<!DOCTYPEHTML>
<Html lang="pt">
<head>
     <meta charset="UTF-8">
     <Title>Cores em CSS</Title>
</head>
     <h2>Cores em CSS</h2>
<body>
     <dl>
  <dt>RGB</dt>
  <dd>Sintaxe baseada nos canais vermelho, verde e azul. Exemplo: <code>color: rgb(255, 0, 0);</code></dd>

  <dt>HEX</dt>
  <dd>Sintaxe hexadecimal de 6 dígitos. Exemplo: <code>color: #FF0000;</code></dd>

  <dt>HSL</dt>
  <dd>Sintaxe baseada em Matiz, Saturação e Luminosidade. Exemplo: <code>color: hsl(0, 100%, 50%);</code></dd>
</dl>


</body>
</html>
