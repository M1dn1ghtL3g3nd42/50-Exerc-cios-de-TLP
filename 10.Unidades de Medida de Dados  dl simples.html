     <Title>Unidades de Medida de Dados</Title>

     <h2>Unidades de Medida de Dados</h2>
<body>
    <dl>
  <dt>Bit</dt>
  <dd>Menor unidade de informação digital (valor 0 ou 1).</dd>

  <dt>Byte</dt>
  <dd>Conjunto de 8 bits.</dd>

  <dt>Kilobyte (KB)</dt>
  <dd>Equivale a 1.024 bytes.</dd>

  <dt>Megabyte (MB)</dt>
  <dd>Equivale a 1.024 kilobytes.</dd>

  <dt>Gigabyte (GB)</dt>
  <dd>Equivale a 1.024 megabytes.</dd>
</dl>


</body>
</html>
